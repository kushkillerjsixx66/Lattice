name: World Engine Tests

on:
  push:
    branches:
      - feat/world-engine-state-store-v0.1
    paths:
      - "world-engine/**"
      - ".github/workflows/world-engine-tests.yml"
  pull_request:
    paths:
      - "world-engine/**"
      - ".github/workflows/world-engine-tests.yml"

permissions:
  contents: read

jobs:
  world-engine-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install --upgrade pytest
      - name: Run world-engine tests
        run: python -m pytest world-engine/tests -q
